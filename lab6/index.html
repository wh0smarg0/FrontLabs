<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сахно Маргарита Юріївна | Група: ІО-35 | Лаб. №6 | Варіант 10</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        h1 { margin-bottom: 20px; color: #333; }

        #loadBtn {
            padding: 12px 25px;
            font-size: 18px;
            background-color: #555;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 30px;
        }

        #loadBtn:hover { background-color: #333; }

        #results {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 250px;
            overflow: hidden;
            text-align: center;
            padding-bottom: 20px;
            animation: fadeIn 0.5s ease-in;
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background-color: #ddd;
        }

        .card-info { padding: 15px; }
        .card-info p { margin: 8px 0; font-size: 14px; color: #555; word-break: break-all; }
        .card-info strong { color: #222; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <h1>User Generator (Варіант 10)</h1>
    
    <button id="loadBtn">Завантажити користувача</button>

    <div id="results"></div>

    <script src="script.js"></script>
</body>
</html>
