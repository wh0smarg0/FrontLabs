<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Сахно Маргарита Юріївна | Група: ІО-35 | Лаб. №5 | Варіант 10</title>
    <style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 40px;
        background-color: #f9f9f9;
        font-size: 18px;
    }

    h2 {
        color: #333;
        margin-bottom: 20px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: inline-block;
        width: 280px;
        font-weight: bold;
        color: #555;
    }

    input[type="text"] {
        padding: 10px;
        font-size: 16px;
        width: 300px;
        border: 1px solid #ccc;
        border-radius: 5px;
        transition: border 0.3s;
    }

    .error {
        border: 2px solid #e74c3c !important;
        background-color: #fadbd8;
    }

    .success {
        border: 2px solid #2ecc71 !important;
        background-color: #d5f5e3;
    }
    
    button {
        padding: 12px 24px;
        font-size: 18px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 10px;
    }

    button:hover {
        background-color: #0056b3;
    }

    table {
        border-collapse: collapse;
        margin-top: 30px;
        background-color: white;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    td {
        width: 60px;
        height: 60px;
        text-align: center;
        border: 1px solid #ddd;
        cursor: pointer;
        font-size: 20px;
        font-weight: bold;
        transition: background-color 0.2s;
    }

    td:hover {
        background-color: #f0f0f0;
    }
    
    hr {
        margin: 40px 0;
        border: 0;
        border-top: 1px solid #ccc;
    }
</style>
</head>
<body>

    <h2>Завдання 1: Валідація форми</h2>
    <form id="labForm">
        <div class="form-group">
            <label>ПІБ (ТТТТТТ Т.Т.):</label>
            <input type="text" id="pib" placeholder="Петров П.П.">
        </div>
        <div class="form-group">
            <label>Група (ТТ-ЧЧ):</label>
            <input type="text" id="group" placeholder="ІТ-01">
        </div>
        <div class="form-group">
            <label>Телефон ((ЧЧЧ)-ЧЧЧ-ЧЧ-ЧЧ):</label>
            <input type="text" id="phone" placeholder="(099)-123-45-67">
        </div>
        <div class="form-group">
            <label>Адреса (м. ЧЧЧЧЧЧ):</label>
            <input type="text" id="address" placeholder="м. 123456">
        </div>
        <div class="form-group">
            <label>e-mail (ттт@ттт.com):</label>
            <input type="text" id="email" placeholder="mail@example.com">
        </div>
        <button type="button" onclick="validateForm()">Перевірити</button>
    </form>

    <hr>

    <h2>Завдання 2: Таблиця 6х6</h2>
    <p>Номер варіанта: <strong>10</strong></p>
    <label>Колір для кліку: <input type="color" id="colorPicker" value="#0000ff"></label>
    <br>
    <table id="myTable"></table>

    <script src="script.js"></script>
</body>
</html>
